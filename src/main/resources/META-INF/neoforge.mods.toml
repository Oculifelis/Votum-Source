description='''
Votum binds players to sworn pacts. Melt Sealing Wax in a Seal Brazier, press a Signet into a warrant at the Signet Desk, then keep the oath and the clause. A finished pact is pressed into a Signet Ring or Seal Pendant that gives its boon while worn. Every pact, wax and boon is datapack JSON.
'''

